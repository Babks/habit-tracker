spring.application.name=habit-tracker
spring.datasource.url=jdbc:postgresql://${HABIT_DB_HOST:localhost}:${HABIT_DB_PORT:5432}/${HABIT_DB_NAME}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${HABIT_DB_USER}
spring.datasource.password=${HABIT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true